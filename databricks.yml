# Databricks Asset Bundle configuration for the Agentic Data Reconciliation demo.
#
# Defines:
#   - The Databricks App resource (./app) hosting the FastAPI + Claude agent.
#   - One job per reconciliation notebook (profiler, differ, backfill, verifier),
#     each using serverless compute.
#
# Deploy with:  databricks bundle deploy -t dev
bundle:
  name: recon-agent

variables:
  catalog:
    description: Unity Catalog catalog holding the demo tables.
    default: main
  schema:
    description: Schema holding the demo tables.
    default: recon_demo

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    recon-agent:
      name: recon-agent
      description: "Agentic Data Reconciliation powered by Claude AI"
      source_code_path: .
      resources:
        - name: anthropic-api-key
          secret:
            scope: recon-agent
            key: anthropic-api-key
            permission: READ
        - name: warehouse-id
          secret:
            scope: recon-agent
            key: warehouse-id
            permission: READ

  jobs:
    recon_profiler:
      name: "[recon-agent] Column Profiler"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: profiler
          notebook_task:
            notebook_path: ./notebooks/02_profiler.py

    recon_differ:
      name: "[recon-agent] Full Outer Join Differ"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: differ
          notebook_task:
            notebook_path: ./notebooks/03_differ.py

    recon_backfill:
      name: "[recon-agent] Partition Backfill"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: backfill
          notebook_task:
            notebook_path: ./notebooks/04_backfill.py

    recon_verifier:
      name: "[recon-agent] Post-Remediation Verifier"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: verifier
          notebook_task:
            notebook_path: ./notebooks/05_verifier.py
