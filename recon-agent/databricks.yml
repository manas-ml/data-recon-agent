# Databricks Asset Bundle configuration for the Agentic Data Reconciliation demo.
#
# Defines:
#   - The Databricks App resource (./app) hosting the FastAPI + Claude agent.
#   - One job per reconciliation notebook (profiler, differ, backfill, verifier),
#     each on a single-node DBR 14.3 LTS ML cluster.
#
# Deploy with:  databricks bundle deploy -t dev
bundle:
  name: recon-agent

variables:
  catalog:
    description: Unity Catalog catalog holding the demo tables.
    default: main
  schema:
    description: Schema holding the demo tables.
    default: recon_demo
  node_type_id:
    description: Cluster node type for the notebook jobs.
    default: i3.xlarge

# Common cluster + tags reused by every job below.
# Anchors keep the single-node DBR 14.3 LTS ML definition in one place.
targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    recon-agent:
      name: recon-agent
      description: "Agentic Data Reconciliation powered by Claude AI"
      source_code_path: ./app

  jobs:
    recon_profiler:
      name: "[recon-agent] Column Profiler"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: profiler
          notebook_task:
            notebook_path: ./notebooks/02_profiler.py
          new_cluster:
            spark_version: 14.3.x-cpu-ml-scala2.12
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode

    recon_differ:
      name: "[recon-agent] Full Outer Join Differ"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: differ
          notebook_task:
            notebook_path: ./notebooks/03_differ.py
          new_cluster:
            spark_version: 14.3.x-cpu-ml-scala2.12
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode

    recon_backfill:
      name: "[recon-agent] Partition Backfill"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: backfill
          notebook_task:
            notebook_path: ./notebooks/04_backfill.py
          new_cluster:
            spark_version: 14.3.x-cpu-ml-scala2.12
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode

    recon_verifier:
      name: "[recon-agent] Post-Remediation Verifier"
      tags:
        team: data-quality
        app: recon-agent
      tasks:
        - task_key: verifier
          notebook_task:
            notebook_path: ./notebooks/05_verifier.py
          new_cluster:
            spark_version: 14.3.x-cpu-ml-scala2.12
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
