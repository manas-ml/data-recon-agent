# Databricks App manifest for the Agentic Data Reconciliation demo.
#
# This file is read by Databricks Apps at deploy time. The `command` block is
# the process Databricks Apps launches; the `env` block wires Databricks secrets
# into the process environment so no tokens are ever hardcoded in source.
name: recon-agent
description: "Agentic Data Reconciliation powered by Claude AI"

command:
  - uvicorn
  - app.main:app
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Anthropic API key, sourced from the Databricks secret scope "recon-agent".
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secret:
        scope: recon-agent
        key: anthropic-api-key

  # SQL Warehouse used for all Databricks SQL connector calls.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom:
      secret:
        scope: recon-agent
        key: warehouse-id
